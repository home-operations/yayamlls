---
# yaml-language-server: $schema=https://raw.githubusercontent.com/zizmorcore/zizmor/main/docs/schemas/zizmor.schema.json
rules:
  # Go cache on the goreleaser split legs (goreleaser.yaml): tag runs only
  # restore caches saved from main, and PRs can't write those (PR cache saves
  # are scoped to the PR).
  cache-poisoning:
    ignore:
      - goreleaser.yaml
  # The action installs yayamlls into its own directory (inputs.bindir, else a
  # RUNNER_TOOL_CACHE subpath) and must put it on PATH for later steps.
  github-env:
    ignore:
      - action.yml
