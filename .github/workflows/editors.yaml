---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Editors

on:
  pull_request:
    branches:
      - main
    paths:
      - editors/**
      - .github/workflows/editors.yaml
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  vscode:
    name: Build VS Code Extension
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: editors/vscode
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out yayamlls.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yayamlls-vsix
          path: editors/vscode/yayamlls.vsix
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" yayamlls.vsix --clobber --repo "$GITHUB_REPOSITORY"

  zed:
    name: Build Zed Extension
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add wasm target
        run: rustup target add wasm32-wasip1

      - name: Build
        run: cargo build --release --locked --target wasm32-wasip1
